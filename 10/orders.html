<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы - Food Construct</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <h1>Food Construct</h1>
        <nav>
            <a href="index.html">О нас</a>
            <a href="landing.html">Главная</a>
            <a href="lunch.html">Собрать ланч</a>
            <a href="checkout.html">Оформить заказ</a>
            <a href="orders.html" id="active">Заказы</a>
            <a href="contacts.html">Контакты</a>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <section>
            <h2>Ваши заказы</h2>
            <div id="orders-list" class="orders-list">
                <!-- Список заказов будет добавлен через JavaScript -->
            </div>
            <div id="empty-orders" class="empty-orders" style="display: none;">
                <p>У вас пока нет заказов.</p>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>Позвонить нам +7-000-000-00-00</p>
    </footer>

    <!-- Модальное окно "Подробнее" -->
    <div id="modal-details" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('modal-details')">&times;</button>
            <h2>Подробности заказа</h2>
            <div id="order-details-content" class="order-details-content">
                <!-- Содержимое будет добавлено через JavaScript -->
            </div>
            <div class="modal-buttons">
                <button class="btn-ok" onclick="closeModal('modal-details')">Ок</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно "Редактирование" -->
    <div id="modal-edit" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('modal-edit')">&times;</button>
            <h2>Редактирование заказа</h2>
            <form id="edit-order-form" class="edit-order-form">
                <div class="form-group">
                    <label for="edit-full_name">Имя</label>
                    <input type="text" id="edit-full_name" name="full_name" required>
                </div>

                <div class="form-group">
                    <label for="edit-email">Email</label>
                    <input type="email" id="edit-email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="edit-phone">Номер телефона</label>
                    <input type="tel" id="edit-phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="edit-delivery_address">Адрес доставки</label>
                    <input type="text" id="edit-delivery_address" name="delivery_address" required>
                </div>

                <div class="form-group">
                    <label>Время доставки</label>
                    <div class="radio-group">
                        <input type="radio" id="edit-delivery-time-now" name="delivery_type" value="now" required>
                        <label for="edit-delivery-time-now">Как можно скорее</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="edit-delivery-time-later" name="delivery_type" value="by_time">
                        <label for="edit-delivery-time-later">К указанному времени</label>
                    </div>
                </div>

                <div class="form-group" id="edit-delivery-time-group" style="display: none;">
                    <label for="edit-delivery_time">Время доставки</label>
                    <input type="time" id="edit-delivery_time" name="delivery_time" min="07:00" max="23:00" step="300">
                    <small>Доступное время доставки: 7:00 до 23:00</small>
                </div>

                <div class="form-group">
                    <label for="edit-comment">Комментарии к заказу</label>
                    <textarea id="edit-comment" name="comment" rows="4" cols="50"></textarea>
                </div>

                <div class="modal-buttons">
                    <button type="submit" class="btn-save">Сохранить</button>
                    <button type="button" class="btn-cancel" onclick="closeModal('modal-edit')">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно "Удаление" -->
    <div id="modal-delete" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('modal-delete')">&times;</button>
            <h2>Подтверждение удаления</h2>
            <p class="delete-confirmation-text">Вы уверены, что хотите удалить этот заказ?</p>
            <div class="modal-buttons">
                <button class="btn-delete" onclick="confirmDelete()">Да</button>
                <button class="btn-cancel" onclick="closeModal('modal-delete')">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Уведомления -->
    <div id="notification" class="notification-overlay" style="display: none;">
        <div class="notification">
            <p class="notification-text" id="notification-text"></p>
            <button class="notification-button" onclick="closeNotification()">Ок</button>
        </div>
    </div>

    <!-- Подключаем скрипты -->
    <script src="dishes.js"></script>
    <script src="orders.js"></script>
</body>
</html>
